[package]
name = "innerlight"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "YouTube and YouTube Music client shared by LunoRX desktop and mobile"
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11.0"
thiserror = "2"
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
